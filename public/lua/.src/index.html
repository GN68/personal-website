<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lua 5.3 Sandbox</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
		rel="stylesheet">
	<style>
		@import "colors.css";

		:root {
			--border: #1D2024;
		}

		* {
			font-family: "JetBrains Mono", serif;
			color: lavender;
		}

		body {
			display: flex;
			box-sizing: border-box;
			flex-direction: column;
			gap: 1rem;

			min-height: 100vh;
			margin: 0;

			background-color: #292D32;
		}


		.output {
			position: absolute;
			left: calc(50% + 1rem);
			right: 1rem;
			padding-top: 1rem;
			padding-bottom: 10rem;
			white-space-collapse: preserve;
			margin-bottom: 25%;
		}

		#workspace {
			width: 50%;
			height: 100%;
			position: fixed;
			display: flex;
			flex-direction: column;
			border-right: 2px solid var(--border);
			box-sizing: border-box;
		}

		#navbar {
			display: flex;
			width: 100%;
			height: 3rem;
			background-color: rgba(163 200 255 / 0.07);
			border-bottom: 2px solid var(--border);
			row-gap: 0;
		}

		#editor {
			width: 100%;
			height: 100%;
			position: relative;
			color: white;
			resize: none;
		}

		.navbtn {
			position: relative;
			flex: 1;
			display: flex;
		}

		input[type=button] {
			background-color: transparent;
			color: gainsboro;
			margin: 0;
			flex: 1;
			padding-right: 2rem;
			padding-left: 2rem;

			height: 100%;
			border: none;
		}


		input[type=button]:hover {
			background-color: var(--light-green);
			color: var(--border);
		}

		input[type=button]:active {
			background-color: var(--green);
		}

		.keybind {
			position: absolute;
			font-size: 8pt;
			width: 100%;
			bottom: 0;
			pointer-events: none;
			color: #858585AB;
			text-align: center;
		}

		input[type=button]:hover .keybind {
			color: black !important;
		}

		@media screen and (max-aspect-ratio: 1/1) {
			.editor {
				top: 75%;
				left: 0;
				right: 0;
				bottom: 0;
			}

			#workspace {
				width: 100%;
				height: 50%;
				bottom: 0;
				position: fixed;
				display: flex;
				flex-direction: column;
				border-top: 2px solid var(--border);
				border-right: 0;
				box-sizing: border-box;

			}

			.output {
				position: absolute;
				left: 1rem;
				right: 1rem;
				white-space-collapse: preserve;
				margin-bottom: 25%;
			}
		}

		#highlight,
		#input {
			position: absolute;
			inset: 0;
			margin: 0;
			padding: 12px;
			border: 0;
			box-sizing: border-box;
			font: inherit;
			letter-spacing: normal;
			tab-size: 2;
			white-space: pre;
			overflow: auto;
		}

		#highlight pre {
			margin: 0;
			padding: 0;
			background: transparent !important;
			font: inherit;
			overflow: visible;
		}

		#highlight {
			pointer-events: none;
		}

		#input {
			background: transparent !important;
			color: transparent;
			caret-color: #fff;
			resize: none;
			outline: none;
			z-index: 1;
		}

		#input::selection {
			background: rgba(120, 160, 255, .35);
		}
	</style>
	<script src="fengari-web.js" type="text/javascript"></script>

</head>

<body>
	<div id="workspace">
		<div id="navbar">
			<div class="navbtn">
				<input type="button" id="send" value="Run">
				<div class="keybind">Ctrl + Enter</div>
			</div>
			<div class="navbtn">
				<input type="button" id="save" value="Save">
				<div class="keybind">Ctrl + S</div>
			</div>
			<div class="navbtn">
				<input type="button" id="open" value="Open">
				<div class="keybind">Ctrl + O</div>
			</div>

			<div class="navbtn">
				<input type="button" id="home" value="Home">
			</div>
		</div>
		<div id="editor">
			<div id="highlight" aria-hidden="true"></div>
			<textarea id="input" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
		</div>
	</div>
	<div id="logs" class="output">Lua 5.3 Sandbox</div>


	<script type="application/lua" src="./index.lua"></script>

	<script type="module">
		// SYNTAX HIGHLIGHTING CODE

		import { createHighlighterCore } from 'shiki/core'
		import { createJavaScriptRegexEngine } from 'shiki/engine/javascript'

		const highlighter = await createHighlighterCore({
			themes: [import('shiki/themes/github-dark.mjs')],
			langs: [import('shiki/langs/lua.mjs')],
			engine: createJavaScriptRegexEngine(),
		})

		const input = document.getElementById('input');
		const output = document.getElementById('highlight');

		function render() {
			let code = input.value;
			if (code.endsWith('\n')) code += ' ';

			output.innerHTML = highlighter.codeToHtml(code, {
				lang: 'lua',
				theme: 'github-dark',
			});
		}

		function syncScroll() {
			output.scrollTop = input.scrollTop;
			output.scrollLeft = input.scrollLeft;
		}

		input.addEventListener('input', render);
		input.addEventListener('scroll', syncScroll);

		// making tab insert spaces instead of moving focus
		input.addEventListener('keydown', (e) => {
			if (e.key === 'Tab') {
				e.preventDefault();
				input.setRangeText('  ', input.selectionStart, input.selectionEnd, 'end');
				render();
			}
		});
		render();

		// NAVIGATION BAR CODE (the run button is in index.lua)
		const saveButton = document.getElementById("save")
		const openButton = document.getElementById("open")

		function fallbackSaveTextFile(textContent, filename = 'script.lua') {
			// 1. Create a data blob from your text string
			const blob = new Blob([textContent], { type: 'text/plain' });

			// 2. Generate a temporary local URL pointing to that blob
			const blobURL = URL.createObjectURL(blob);

			// 3. Create a hidden <a> element
			const tempLink = document.createElement('a');
			tempLink.href = blobURL;
			tempLink.download = filename; // Tells browser to download instead of navigate
			tempLink.style.display = 'none';

			// 4. Append to DOM, programmatically click it, then remove it
			document.body.appendChild(tempLink);
			tempLink.click();
			document.body.removeChild(tempLink);
			// 5. Clean up the URL allocation to free memory
			URL.revokeObjectURL(blobURL);
		}

		function openTextFileLegacy() {
			const fileDialog = document.createElement('input');
			fileDialog.type = 'file';
			fileDialog.accept = '.lua, text/plain'; // Restrict files to text types

			fileDialog.onchange = (event) => {
				const file = event.target.files[0];
				if (!file) return;

				const reader = new FileReader();
				reader.onload = (e) => {
					const contents = e.target.result;
					input.value = contents
					render()
				};

				reader.readAsText(file); // Triggers the file reading process
			};

			fileDialog.click();
		}


		input.addEventListener('keydown', (e) => {
			if (e.key == "s" && e.ctrlKey) {
				saveButton.click()
				e.preventDefault();
			}
			if (e.key == "o" && e.ctrlKey) {
				openButton.click()
				e.preventDefault();
			}
		});

		saveButton.addEventListener('click', function () {
			fallbackSaveTextFile(input.value)
		})

		openButton.addEventListener('click', function () {
			openTextFileLegacy()
		})
	</script>
</body>

</html>
